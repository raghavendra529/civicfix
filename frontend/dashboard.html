<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Complaint Tracker | CivicFix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="/" class="flex items-center space-x-2">
          <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
            <i class="fa-solid fa-road text-base"></i>
          </div>
          <span class="font-bold text-xl text-slate-900 tracking-tight">Civic<span class="text-blue-600">Fix</span></span>
        </a>
      </div>
      <nav class="flex items-center space-x-1 sm:space-x-3">
        <a href="/" class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-blue-600 rounded-lg hover:bg-slate-100">Home</a>
        <a href="/report.html" class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-blue-600 rounded-lg hover:bg-slate-100">Report Issue</a>
        <a href="/dashboard.html" class="px-3 py-2 text-sm font-semibold text-blue-600 rounded-lg bg-blue-50">Citizen Tracker</a>
        <a href="/admin.html" class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-blue-600 rounded-lg hover:bg-slate-100">Municipal Admin</a>
        <a href="/research.html" class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-blue-600 rounded-lg hover:bg-slate-100">ML Research</a>
        <div id="auth-nav-container" class="ml-1 sm:ml-3"></div>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-3 py-1 rounded-full">Citizen Infrastructure Portal</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2">Active Public Works Complaints</h1>
        <p class="text-sm text-slate-600 mt-1">Track remediation status, AI confidence scores, and municipal dispatch workflows.</p>
      </div>
      <a href="/report.html" class="inline-flex items-center space-x-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md transition-all self-start md:self-auto">
        <i class="fa-solid fa-plus"></i>
        <span>Report New Issue</span>
      </a>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
      <!-- Status Tabs & My Reports Toggle -->
      <div class="flex items-center space-x-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
        <button onclick="setStatusFilter('all')" id="tab-all" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm">All</button>
        <button onclick="setStatusFilter('Pending')" id="tab-pending" class="px-3.5 py-1.5 text-xs font-medium rounded-lg text-slate-600 hover:bg-slate-100">Pending</button>
        <button onclick="setStatusFilter('In Progress')" id="tab-progress" class="px-3.5 py-1.5 text-xs font-medium rounded-lg text-slate-600 hover:bg-slate-100">In Progress</button>
        <button onclick="setStatusFilter('Resolved')" id="tab-resolved" class="px-3.5 py-1.5 text-xs font-medium rounded-lg text-slate-600 hover:bg-slate-100">Resolved</button>
        <button onclick="toggleMyComplaints()" id="tab-mine" class="hidden px-3.5 py-1.5 text-xs font-semibold rounded-lg text-blue-700 bg-blue-50 border border-blue-200 hover:bg-blue-100 flex items-center space-x-1.5 ml-2">
          <i class="fa-solid fa-user-check"></i>
          <span>My Reports</span>
        </button>
      </div>

      <!-- Category Filter & Search -->
      <div class="flex items-center space-x-3 w-full md:w-auto">
        <select id="category-filter" onchange="loadData()" class="px-3 py-1.5 text-xs border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">
          <option value="all">All Categories</option>
          <option value="pothole">Pothole</option>
          <option value="crack">Road Crack</option>
          <option value="manhole">Damaged Manhole</option>
          <option value="garbage">Garbage</option>
          <option value="broken_streetlight">Broken Streetlight</option>
          <option value="pipeline_leakage">Pipeline Leakage</option>
          <option value="normal">Normal</option>
        </select>
        <div class="relative w-full md:w-64">
          <input type="text" id="search-input" onkeyup="handleSearch(event)" placeholder="Search complaints..." class="w-full pl-8 pr-3 py-1.5 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
        </div>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="complaints-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading Placeholder -->
      <div class="col-span-full py-16 text-center text-slate-400">
        <div class="inline-block w-8 h-8 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-sm font-semibold">Loading municipal complaints...</p>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    let activeStatus = "all";
    let filterMine = false;

    function initUserFeatures() {
      const u = getStoredUser();
      const mineBtn = document.getElementById("tab-mine");
      if (u && mineBtn) {
        mineBtn.classList.remove("hidden");
      }
    }

    function toggleMyComplaints() {
      filterMine = !filterMine;
      const btn = document.getElementById("tab-mine");
      if (filterMine) {
        btn.className = "px-3.5 py-1.5 text-xs font-bold rounded-lg bg-blue-700 text-white shadow-sm flex items-center space-x-1.5 ml-2";
      } else {
        btn.className = "px-3.5 py-1.5 text-xs font-semibold rounded-lg text-blue-700 bg-blue-50 border border-blue-200 hover:bg-blue-100 flex items-center space-x-1.5 ml-2";
      }
      loadData();
    }

    function setStatusFilter(status) {
      activeStatus = status;
      ["all", "pending", "progress", "resolved"].forEach(s => {
        const btn = document.getElementById(`tab-${s}`);
        if (btn) {
          btn.className = "px-3.5 py-1.5 text-xs font-medium rounded-lg text-slate-600 hover:bg-slate-100";
        }
      });
      const activeBtnId = status === "all" ? "tab-all" : (status === "Pending" ? "tab-pending" : (status === "In Progress" ? "tab-progress" : "tab-resolved"));
      document.getElementById(activeBtnId).className = "px-3.5 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm";
      loadData();
    }

    let searchTimeout;
    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(loadData, 300);
    }

    async function loadData() {
      const category = document.getElementById("category-filter").value;
      const search = document.getElementById("search-input").value;

      const params = {
        status: activeStatus,
        category: category,
        search: search
      };
      if (filterMine) {
        params.mine = "true";
      }

      const data = await fetchComplaints(params);

      const grid = document.getElementById("complaints-grid");
      if (!data.complaints || data.complaints.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-slate-200">
            <i class="fa-regular fa-folder-open text-4xl text-slate-300 mb-3"></i>
            <p class="text-sm font-bold text-slate-700">No complaints found</p>
            <p class="text-xs text-slate-400 mt-1">Try adjusting your filters or search terms.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = data.complaints.map(c => {
        const catBadge = CATEGORY_BADGES[c.category] || "badge-normal";
        const catName = CATEGORY_NAMES[c.category] || c.category;
        const statusClass = c.status === "Resolved" ? "status-resolved" : (c.status === "In Progress" ? "status-progress" : "status-pending");
        const confPct = Math.round(c.confidence * 100);

        return `
          <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm card-hover flex flex-col">
            <div class="relative h-44 bg-slate-100 overflow-hidden">
              <img src="/uploads/${c.image_filename}" alt="${catName}" class="w-full h-full object-cover">
              <span class="absolute top-3 left-3 text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm ${catBadge}">
                ${catName} (${confPct}%)
              </span>
              <span class="absolute top-3 right-3 text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm ${statusClass}">
                ${c.status}
              </span>
            </div>

            <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
              <div class="space-y-2">
                <div class="flex items-center justify-between text-[11px] text-slate-400">
                  <span>#CMP-${c.id.toString().padStart(4, '0')}</span>
                  <span>${c.created_at.split(' ')[0]}</span>
                </div>
                <h3 class="font-bold text-slate-900 text-sm line-clamp-1">${c.title}</h3>
                <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed">${c.description || "No description provided."}</p>
              </div>

              <div class="pt-3 border-t border-slate-100 space-y-2 text-xs">
                <div class="flex items-center space-x-2 text-slate-500">
                  <i class="fa-solid fa-location-dot text-slate-400 text-xs"></i>
                  <span class="truncate">${c.address || "Street location"}</span>
                </div>
                <div class="flex items-center justify-between pt-1">
                  <span class="text-[11px] font-semibold text-slate-500">Priority: <b class="text-slate-800">${c.priority}</b></span>
                  <span class="text-[11px] text-slate-400">By: ${c.user_name.split(' ')[0]}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // Initial Load
    initUserFeatures();
    loadData();
  </script>
</body>
</html>
